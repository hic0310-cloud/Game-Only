<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>13번째 밤</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="13번째 밤">
<meta name="theme-color" content="#10131C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Gowun+Dodum&display=swap">
<style>
:root{
  --ink:#2B2318; --bg:#E2D4AC; --panel:#CBB98C; --panel2:#BDAC7D; --line:#9C8C61;
  --accent:#8B3A2B; --accent-ink:#F3E7CE; --good:#4C5B3D; --gold:#8A631F;
  --vet1:#2E6DA4; --vet2:#7A3FA0;
  --t-tree:#7FA06A; --t-rock:#A39C8C; --t-water:#6E9CC4; --t-wall:#B08A5E;
  --shadow: 0 2px 0 rgba(43,35,24,.18);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
:root[data-mode="night"]{
  --ink:#E8E2D0; --bg:#10131C; --panel:#1A2032; --panel2:#242C44; --line:#3A4260;
  --accent:#C4432B; --accent-ink:#1A0E0A; --good:#6FA184; --gold:#D0A23F;
  --vet1:#6FB4E8; --vet2:#C9A0FA;
  --t-tree:#2C4A31; --t-rock:#454650; --t-water:#1E3E62; --t-wall:#5A4330;
  --shadow: 0 2px 0 rgba(0,0,0,.4);
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{scroll-padding-top:var(--safe-t);}
body{
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  min-height:100%;
  transition:background .6s ease, color .6s ease;
  overscroll-behavior-y:none;
}
.num, .hud, h1,h2,h3, button, .badge, .stat-num{ font-family:'Teko','Gowun Dodum',sans-serif; }
button{ font-family:inherit; }

#app{ max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative; }

/* ---------- 공통 ---------- */
.screen{ padding:14px 14px calc(14px + var(--safe-b)); display:flex; flex-direction:column; gap:12px; flex:1; }
.topbar{
  position:sticky; top:var(--safe-t); z-index:5; background:var(--bg); padding:10px 14px 8px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-bottom:1px solid var(--line);
}
.title-lg{ font-size:30px; line-height:1; letter-spacing:.02em; margin:0; }
.title-md{ font-size:23px; line-height:1.05; margin:0; }
.sub{ opacity:.72; font-size:13px; margin:2px 0 0; }

.res-pill{ display:flex; align-items:center; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 10px 4px 8px; font-size:15px; }
.res-row{ display:flex; gap:6px; flex-wrap:wrap; }
.res-num{ font-size:19px; font-weight:600; }

.bar{ height:9px; border-radius:5px; background:var(--panel2); border:1px solid var(--line); overflow:hidden; }
.bar > i{ display:block; height:100%; background:var(--good); transition:width .35s ease; }
.bar.hp-house > i{ background:var(--accent); }
.bar-label{ display:flex; justify-content:space-between; font-size:12px; opacity:.75; margin-bottom:2px; }

.card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; box-shadow:var(--shadow); }
.card h3{ font-size:19px; margin:0 0 6px; }

.btn{ appearance:none; border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:8px; padding:9px 12px; font-size:15px; font-weight:600; box-shadow:var(--shadow); }
.btn:active{ transform:translateY(1px); box-shadow:none; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.ghost{ background:transparent; box-shadow:none; }
.btn:disabled{ opacity:.42; }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
.btn.full{ width:100%; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.footer-cta{ position:sticky; bottom:var(--safe-b); background:linear-gradient(to top, var(--bg) 70%, transparent); padding:10px 14px calc(10px + var(--safe-b)); }
.deploy-hint{ font-size:12px; opacity:.75; text-align:center; padding:2px 0 6px; }
.deploy-edit{ text-decoration:underline; }

/* ---------- 낮: 정찰 장소 카드 ---------- */
.loc-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:left; display:flex; flex-direction:column; gap:2px; }
.loc-em{ font-size:26px; }
.loc-name{ font-size:17px; font-weight:700; }
.loc-tag{ font-size:12px; opacity:.7; }

/* ---------- 이벤트 모달 ---------- */
.modal-wrap{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:30; padding-bottom:var(--safe-b); }
.modal{ width:100%; max-width:480px; background:var(--bg); border-radius:16px 16px 0 0; padding:18px 16px calc(16px + var(--safe-b)); display:flex; flex-direction:column; gap:10px; max-height:88vh; overflow:auto; border-top:1px solid var(--line); }
.modal .em-big{ font-size:40px; }
.choice-btn{ text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px; }
.choice-cost{ font-size:12px; opacity:.7; }
.result-msg{ background:var(--panel2); border-radius:10px; padding:12px; font-size:15px; }
.gain-row{ display:flex; flex-wrap:wrap; gap:6px; }
.gain-chip{ background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:5px 9px; font-size:13px; }

/* ---------- 융합 단계 구분 ---------- */
.fuse-stage + .fuse-stage{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
.fuse-stage-h{ font-size:13px; opacity:.65; font-weight:600; margin-bottom:2px; }
.sell-btn{ font-size:12px; padding:6px 9px; flex-shrink:0; }
.unit-btns{ display:flex; flex-direction:column; gap:5px; flex-shrink:0; }
.rename-row{ align-items:center; }
input, textarea{ -webkit-user-select:text; user-select:text; }
.rename-input{ width:100%; font-family:inherit; font-size:15px; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); }

/* ---------- 로스터 ---------- */
.unit-row{ display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px dashed var(--line); }
.unit-row:last-child{ border-bottom:none; }
.deploy-row{ cursor:pointer; border-radius:10px; }
.deploy-row.sel{ background:color-mix(in srgb, var(--good) 16%, transparent); }
.deploy-check{ width:20px; flex-shrink:0; text-align:center; font-size:16px; }
.unit-em{ font-size:26px; width:34px; text-align:center; position:relative; }
.unit-em.vet-1, .unit-em.vet-2{ border-radius:50%; }
.unit-em.vet-1{ box-shadow:0 0 0 2px var(--vet1); }
.unit-em.vet-2{ box-shadow:0 0 0 2px var(--vet2); }
.unit-badge{ position:absolute; font-size:13px; right:-6px; bottom:-4px; }
.vet-badge{ font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; margin-left:2px; white-space:nowrap; }
.vet-badge.vet-1{ color:var(--vet1); border:1px solid var(--vet1); }
.vet-badge.vet-2{ color:var(--vet2); border:1px solid var(--vet2); }
.vet-badge.officer{ color:var(--gold); border:1px solid var(--gold); }
.unit-mid{ flex:1; min-width:0; }
.unit-name{ font-size:15px; font-weight:700; display:flex; gap:6px; align-items:baseline; }
.unit-rank{ font-size:11px; opacity:.65; font-weight:400; }
.unit-stats{ font-size:12px; opacity:.75; }
.unit-hpbar{ margin-top:3px; width:100%; max-width:180px; }

/* ---------- 밤: 전장 ---------- */
.night-top{ display:flex; flex-direction:column; gap:6px; }
.boss-strip{ display:flex; align-items:center; gap:8px; }
.turn-chip{ background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:3px 9px; font-size:16px; white-space:nowrap; }
.log-line{ font-size:13px; line-height:1.4; height:2.8em; opacity:.85; padding:0 2px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.log-line.hint{ opacity:1; color:var(--gold); }
.log-line.won{ opacity:1; color:var(--good); font-weight:700; }

.board-wrap{ display:flex; justify-content:center; }
.board{ display:grid; gap:3px; touch-action:manipulation; --tile:42px; }
.tile{ width:var(--tile); height:var(--tile); border-radius:6px; background:var(--panel2); border:1px solid var(--line); position:relative; display:flex; align-items:center; justify-content:center; font-size:calc(var(--tile) * .5); }
/* 지형지물 — 지상 유닛 통과 불가 */
.tile.t-tree{ background:var(--t-tree); border-color:color-mix(in srgb, var(--t-tree) 70%, #000); }
.tile.t-rock{ background:var(--t-rock); border-color:color-mix(in srgb, var(--t-rock) 70%, #000); }
.tile.t-water{ background:var(--t-water); border-color:color-mix(in srgb, var(--t-water) 70%, #000);
  background-image:radial-gradient(circle at 30% 35%, rgba(255,255,255,.10) 0 18%, transparent 19%), radial-gradient(circle at 70% 70%, rgba(255,255,255,.08) 0 14%, transparent 15%); }
.tile.wall{ background:var(--t-wall); border-color:color-mix(in srgb, var(--t-wall) 70%, #000); }
.tile .ter{ font-size:calc(var(--tile) * .46); }
.tile .wave{ font-size:calc(var(--tile) * .5); color:rgba(190,220,255,.55); font-weight:700; line-height:1; }
/* 전장의 보급품·구조 대상 */
.tile.pickup{ box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--gold) 75%, transparent); }
.tile .pk{ font-size:calc(var(--tile) * .44); animation:bob 1.8s ease-in-out infinite; }
.tile .sos{ position:absolute; top:-4px; left:-4px; font-size:calc(var(--tile) * .3); }
@keyframes bob{ 50%{ transform:translateY(-2px); } }
/* 지켜야 할 마을 (2×2) */
.village{ position:relative; border-radius:10px; border:2px solid var(--gold); background:color-mix(in srgb, var(--gold) 20%, var(--panel2)); display:flex; align-items:center; justify-content:center; }
.village .v-em{ font-size:calc(var(--tile) * 1.15); line-height:1; }
.village .v-tower{ position:absolute; top:3px; right:5px; font-size:calc(var(--tile) * .34); }
.village .v-hp{ position:absolute; left:7px; right:7px; bottom:6px; height:5px; border-radius:3px; background:rgba(0,0,0,.35); overflow:hidden; }
.village .v-hp i{ display:block; height:100%; background:var(--accent); transition:width .35s ease; }
.village.hit-flash{ box-shadow:0 0 0 2px var(--accent), 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); border-color:var(--accent); }
.board-note{ font-size:11.5px; opacity:.7; text-align:center; line-height:1.4; }
.loot-box{ width:100%; display:flex; flex-direction:column; gap:6px; align-items:center; }
.tile.reach{ box-shadow:inset 0 0 0 2px var(--good); background:color-mix(in srgb, var(--good) 22%, var(--panel2)); }
.tile.hit{ box-shadow:inset 0 0 0 2px var(--accent); background:color-mix(in srgb, var(--accent) 26%, var(--panel2)); }
.tile.aoe{ box-shadow:inset 0 0 0 2px var(--vet2); background:color-mix(in srgb, var(--vet2) 30%, var(--panel2)); animation:aoepulse 1s ease-in-out infinite; }
@keyframes aoepulse{ 50%{ box-shadow:inset 0 0 0 3px var(--vet2); } }
.tile.sel{ box-shadow:inset 0 0 0 2px var(--gold); }
.tile.reach.pickup{ box-shadow:inset 0 0 0 2px var(--gold); background:color-mix(in srgb, var(--gold) 26%, var(--panel2)); }
.tile.t-water.hit, .tile.t-tree.hit, .tile.t-rock.hit, .tile.wall.hit{ background-image:none; }
.tile .mini-hp{ position:absolute; left:3px; right:3px; bottom:2px; height:4px; border-radius:2px; background:rgba(0,0,0,.35); overflow:hidden; }
.tile .mini-hp i{ display:block; height:100%; }
.tile .boss-mark{ position:absolute; top:-3px; left:-3px; font-size:10px; }

.unit-tray{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
.tray-chip{ flex:0 0 auto; width:46px; text-align:center; font-size:20px; border:1px solid var(--line); border-radius:8px; padding:4px 2px; background:var(--panel); position:relative; }
.tray-chip.dead{ opacity:.35; }
.tray-chip.acted{ opacity:.55; }
.tray-chip.vet-1{ box-shadow:0 0 0 2px var(--vet1); }
.tray-chip.vet-2{ box-shadow:0 0 0 2px var(--vet2); }
.tray-chip.active{ box-shadow:0 0 0 2px var(--gold); }
.tray-hp{ height:3px; border-radius:2px; background:var(--panel2); margin-top:3px; overflow:hidden; }
.tray-hp i{ display:block; height:100%; background:var(--good); }

.action-bar{ position:sticky; bottom:var(--safe-b); background:var(--bg); border-top:1px solid var(--line); padding:8px 14px calc(8px + var(--safe-b)); display:flex; flex-direction:column; gap:8px; }
.sel-info{ display:flex; align-items:center; gap:8px; font-size:14px; }
.sel-stats{ font-size:12px; opacity:.75; }
.skill-confirm{ display:flex; flex-direction:column; gap:6px; background:color-mix(in srgb, var(--vet2) 16%, transparent); border:1px solid var(--vet2); border-radius:10px; padding:8px 10px; }
.sc-title{ font-size:14px; }
.sc-desc{ font-size:12px; opacity:.8; }
.sel-info .em{ font-size:24px; }
.cd-chip{ font-size:11px; background:var(--panel2); border-radius:6px; padding:1px 6px; }

/* ---------- 결과/엔딩 ---------- */
.result-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:20px; }
.result-em{ font-size:56px; }
.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; }
.stat-box{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 4px; }
.stat-num{ font-size:26px; }
.stat-lbl{ font-size:11px; opacity:.7; }

.tech-row{ display:flex; gap:8px; }
.tech-chip{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; }
.tech-chip .lvdots{ display:flex; gap:3px; justify-content:center; margin-top:3px; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); }
.dot.on{ background:var(--gold); border-color:var(--gold); }

.fade-in{ animation:fadeIn .35s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
@media (prefers-reduced-motion: reduce){ .fade-in{ animation:none; } .bar>i{ transition:none; } .tile .pk{ animation:none; } .tile.aoe{ animation:none; } }

.intro-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; padding:24px; }
.intro-wrap .night-num{ font-size:64px; line-height:1; }
.intro-wrap p{ font-size:16px; max-width:32ch; line-height:1.6; }

/* ---------- 이야기 도감 ---------- */
.codex-card, .codex-unlock-card{ color:inherit; cursor:pointer; font-family:inherit; }
.codex-unlock-card{ width:100%; text-align:center; border:1px solid var(--gold); background:color-mix(in srgb, var(--gold) 14%, var(--panel)); font-size:15px; }
.codex-entry{ display:flex; gap:10px; padding:10px 2px; border-bottom:1px dashed var(--line); }
.codex-entry:last-child{ border-bottom:none; }
.codex-entry.new{ background:color-mix(in srgb, var(--gold) 14%, transparent); border-radius:8px; }
.codex-entry.locked{ opacity:.5; }
.codex-num{ flex:0 0 auto; width:22px; font-size:13px; opacity:.55; padding-top:2px; }
.codex-title{ font-size:15px; font-weight:700; margin-bottom:2px; }
.codex-body{ font-size:14px; line-height:1.6; margin:0; opacity:.9; }

/* ---------- 저장 관리 ---------- */
.slot-list{ display:flex; flex-direction:column; gap:8px; }
.slot-card{ display:flex; gap:10px; align-items:stretch; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; }
.slot-card.empty{ background:transparent; border-style:dashed; }
.slot-mark{ flex:0 0 44px; display:flex; align-items:center; justify-content:center; font-family:'Teko','Gowun Dodum',sans-serif; font-size:30px; line-height:1; border-right:1px solid var(--line); padding-right:8px; color:var(--accent); }
.slot-card.auto .slot-mark{ font-size:17px; font-family:'Gowun Dodum',sans-serif; font-weight:700; color:var(--gold); }
.slot-card.empty .slot-mark{ opacity:.45; }
.slot-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.slot-label{ font-size:12px; opacity:.6; }
.slot-title{ font-size:16px; font-weight:700; }
.slot-body .btn-row{ margin-top:5px; }
.slot-body .btn{ padding:7px 11px; font-size:14px; }
.slot-confirm{ margin-top:6px; background:color-mix(in srgb, var(--accent) 12%, transparent); border:1px solid var(--accent); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px; }
.slot-q{ font-size:13px; line-height:1.5; }
.save-section{ border-top:1px dashed var(--line); padding-top:10px; margin-top:2px; }
.save-section h4{ margin:0 0 4px; font-size:15px; }
.save-textarea{ width:100%; min-height:88px; max-height:160px; font-family:monospace; font-size:11px; line-height:1.4; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); resize:vertical; box-sizing:border-box; }

::-webkit-scrollbar{ display:none; }

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================  상수 · 데이터  ===================== */
const GW = 8, GH = 9;                 // 전장 크기 (가로 8 · 세로 9) — 좌측 하단 2×2가 지켜야 할 마을
const TIER_XP = [0, 40, 90, 160, 260];   // 기술 Lv1~5 필요 누적 경험치
const RANK_XP = [0, 8, 22, 45];       // 계급 0~3 필요 경험치
const ROSTER_MAX = 12;
const OUTINGS_BASE = 3;
const HOUSE_BASE_HP = 40;
const TURN_LIMIT = 30;
const FINAL_NIGHT = 13;
const POWER_HI = 340;                 // 이 전투력 이상이면 최종 보스가 한 단계 강해짐
const TUNE = { hpPerNight: 0.08, hpPerCycle: 0.05, crit: 0.1, block: 0.1, towerBase: 1, towerPer: 2 };
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

/* =====================  전장 지도  ===================== */
/* 마을은 좌측 하단 2×2. 악마는 위쪽 가장자리와 오른쪽 가장자리에서 몰려온다 */
const VILLAGE = { x:0, y:GH-2, w:2, h:2 };
const DEPLOY_TILES = [[2,GH-2],[2,GH-1],[1,GH-3],[0,GH-3],[2,GH-3],[3,GH-2]];   // 출전 대원 초기 위치 (마을 바로 앞)
const SPAWN_TILES  = [[3,0],[4,0],[5,0],[6,0],[7,0],[7,1],[7,2],[7,3],[7,4]];  // 악마 출현 지점
const BOSS_SPAWN   = [[6,0],[7,1],[5,0],[7,2]];
/* 방벽 레벨별 바리케이드 — 마을에서 3칸 떨어진 둘레에 세우되, 앞쪽 통로 두 칸은 항상 비워 둔다 */
const WALL_TILES = [
  [],
  [[0,GH-5],[4,GH-1]],
  [[0,GH-5],[4,GH-1],[1,GH-5]],
  [[0,GH-5],[4,GH-1],[1,GH-5],[4,GH-2]],
];
/* 통과할 수 없는 지형지물 (비행 유닛은 넘어갈 수 있다) — 밤마다 지형이 바뀐다 */
const TERRAIN = {
  tree:  { n:'숲',   em:'🌲', d:'지상 유닛은 지나갈 수 없다 · 비행 유닛은 넘어간다' },
  rock:  { n:'바위', em:'🪨', d:'지상 유닛은 지나갈 수 없다 · 비행 유닛은 넘어간다' },

/* =====================  유틸  ===================== */
function rnd(a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[rnd(0, arr.length - 1)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function key(x, y) { return x + ',' + y; }
/* 한국어 조사(이/가, 을/를, 은/는, 과/와) 자동 선택 — 이름 마지막 글자의 받침 유무 판정 */
function hasBatchim(word) {
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return true;
  return (c - 0xAC00) % 28 !== 0;
}
function josa(word, withB, withoutB) { return word + (hasBatchim(word) ? withB : withoutB); }
function eun(w) { return josa(w, '은', '는'); }
function i(w) { return josa(w, '이', '가'); }
function eul(w) { return josa(w, '을', '를'); }
function gwa(w) { return josa(w, '과', '와'); }

/* =====================  파생 스탯  ===================== */
function techLevel(S, route) {
  const xp = S.techXP[route];
  for (let lv = TIER_XP.length; lv >= 2; lv--) if (xp >= TIER_XP[lv - 1]) return lv;
  return 1;
}
function rankOf(xp) {
  if (xp >= RANK_XP[3]) return 3;
  if (xp >= RANK_XP[2]) return 2;
  if (xp >= RANK_XP[1]) return 1;
  return 0;
}
/* 유닛의 현재 최대체력/공격/방어/이동/사거리 계산 (계급 성장 + 테크 특전 반영) */
function deriveStats(S, u) {
  const base = UT[u.type];
  const rank = rankOf(u.xp);
  let hpMax = base.hp + rank * (base.g.hp || 0);
  let atk = base.atk + rank * (base.g.atk || 0);
  let def = base.def;
  let mov = base.mov, rng = base.rng;
  for (const rt of base.rt) {
    const lv = techLevel(S, rt);
    if (rt === 'H') { if (lv >= 2) hpMax += 2; if (lv >= 3) atk += 1; if (lv >= 4) rng += 1; if (lv >= 5) def += 2; }
    if (rt === 'A') { if (lv >= 2) hpMax += 3; if (lv >= 3) atk += 1; if (lv >= 4) mov += 1; if (lv >= 5) def += 2; }
    if (rt === 'M') { if (lv >= 2) def += 1; if (lv >= 3) hpMax += 4; if (lv >= 4) rng += 1; if (lv >= 5) atk += 2; }
  }
  return { hpMax, atk, def, mov, rng, rank };
}
function syncUnit(S, u) {
  const d = deriveStats(S, u);
  const grew = d.hpMax - (u.hpMax || d.hpMax);
  u.hpMax = d.hpMax; u.atk = d.atk; u.def = d.def; u.mov = d.mov; u.rng = d.rng; u.rank = d.rank;
  if (u.hp == null) u.hp = d.hpMax;
  else if (grew > 0) u.hp = clamp(u.hp + grew, 0, u.hpMax);
  u.hp = clamp(u.hp, 0, u.hpMax);
}
function makeUnit(S, type, rankXp) {
  const base = UT[type];
  const u = {
    id: S.nextId++, type, rt: base.rt.slice(), em: base.em, badge: base.badge || null,
    name: base.n, role: base.role, fly: !!base.fly, sk: Object.assign({}, base.sk),
    xp: rankXp || 0, hp: null, x: -1, y: -1, alive: true, cdLeft: 0,
    statuses: [], kills: 0,

  syncUnit(S, u);
  u.hp = u.hpMax;

/* 참전 등급 (0=신병,1=베테랑,2=마스터) — 누적 킬 카운트 기반, 아군 전용 */
function veteranTier(u) {
  const k = u.kills || 0;
  if (k >= VET_KILLS[2]) return 2;
  if (k >= VET_KILLS[1]) return 1;
  return 0;
}
function critChanceOf(u) { return isPlayerType(u.type) ? VET_CRIT[veteranTier(u)] : TUNE.crit; }
function blockChanceOf(u) { return isPlayerType(u.type) ? VET_BLOCK[veteranTier(u)] : TUNE.block; }
function powerScore(S) {
  let p = 0;
  for (const u of S.roster) p += u.atk * 2 + u.hpMax * 0.5;
  p += (techLevel(S, 'H') + techLevel(S, 'A') + techLevel(S, 'M')) * 15;
  return Math.round(p);

    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy, k = key(nx, ny);
      if (seen.has(k) || !inBounds(nx, ny) || isVillage(nx, ny)) continue;
      seen.add(k); q.push([nx, ny]);

}

/* =====================  밤: 전투 시작  ===================== */
function startNight(S) {

  let squad = S.selectedSquad.map(id => S.roster.find(u => u.id === id)).filter(Boolean);
  if (!squad.length) squad = S.roster.slice(0, cap);

  S.night = {

    u.moved = false; u.acted = false; u.cdLeft = 0; u.statuses = []; u.onceUsed = false;
    const t = DEPLOY_TILES[idx] && !occupant(S, DEPLOY_TILES[idx][0], DEPLOY_TILES[idx][1]) ? DEPLOY_TILES[idx] : freeTileNear(S, 2, GH - 2, u.fly, 6);
    u.x = t[0]; u.y = t[1];

  });

}
function beginCombat(S) { if (S.phase === 'nightIntro') S.phase = 'night'; }
/* 보스를 실제로 전장에 등장시키고, 눈에 띄는 경고를 띄운다 */
function spawnBoss(S) {
  const bossKey = S.night.bossKey;

}
function spawnWave(S, wave) {
  if (!wave) return;
  for (const [type, n] of wave.l) {

      const t = openSpawnTile(S, !!ET[type].fly);

      S.night.enemies.push(spawnEnemy(S, type, t[0], t[1]));
    }
  }
  addLog(S, '악마가 몰려온다!');
}

/* =====================  밤: 이동 판정 · 보급품  ===================== */
function reachableTiles(S, u) {
  const start = key(u.x, u.y);
  const dist = new Map([[start, 0]]);
  const q = [[u.x, u.y]];
  while (q.length) {
    const [cx, cy] = q.shift(); const d = dist.get(key(cx, cy));
    if (d >= u.mov) continue;
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy, k = key(nx, ny);
      if (dist.has(k) || !passable(S, nx, ny, u.fly)) continue;
      if (occupant(S, nx, ny)) continue;
      dist.set(k, d + 1); q.push([nx, ny]);
    }
  }
  dist.delete(start);
  return dist;
}
/* 거리 지도(field)를 따라 이동력 안에서 목표에 가장 가까워지는 칸 — 지형을 돌아서 간다 */
function moveAlongField(S, mover, field) {
  const start = key(mover.x, mover.y);
  const steps = new Map([[start, 0]]), q = [[mover.x, mover.y]];
  let best = [mover.x, mover.y], bestV = field.has(start) ? field.get(start) : Infinity, bestS = 0;
  while (q.length) {
    const [cx, cy] = q.shift(); const s = steps.get(key(cx, cy));
    if (s >= mover.mov) continue;
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy, k = key(nx, ny);
      if (steps.has(k) || !passable(S, nx, ny, mover.fly) || occupant(S, nx, ny)) continue;
      steps.set(k, s + 1); q.push([nx, ny]);
      const v = field.has(k) ? field.get(k) : Infinity;
      if (v < bestV || (v === bestV && s + 1 < bestS)) { bestV = v; best = [nx, ny]; bestS = s + 1; }
    }
  }
  return best;
}
function fieldFrom(S, sources, fly) { return mapField(S.night.map, sources, fly); }
/* 대원과 대상 사이 직선이 비어 있는지 (돌진·급강하용) */
function lineClear(S, u, t) {
  if (u.x !== t.x && u.y !== t.y) return false;
  const dx = Math.sign(t.x - u.x), dy = Math.sign(t.y - u.y);
  let x = u.x + dx, y = u.y + dy;
  while (x !== t.x || y !== t.y) {
    if (!passable(S, x, y, u.fly) || occupant(S, x, y)) return false;
    x += dx; y += dy;
  }
  return true;
}
/* 대원이 보급품 칸에 들어서면 회수 */
function collectPickup(S, u) {
  const p = pickupAt(S, u.x, u.y); if (!p) return;
  p.taken = true;
  const gains = [];
  let note = '';
  if (p.kind === 'crate') { S.mat += p.amt; gains.push({ ic: '⚙️', txt: `자재 +${p.amt}` }); }
  else if (p.kind === 'survivor') { S.ref += p.amt; gains.push({ ic: '👥', txt: `난민 +${p.amt}` }); }
  else if (p.kind === 'intel') { S.techXP[p.route] += p.amt; gains.push({ ic: ROUTES[p.route].ic, txt: `${ROUTES[p.route].n} 경험치 +${p.amt}` }); }
  else if (p.kind === 'rescue') {
    if (S.roster.length < ROSTER_MAX) {
      const nu = makeUnit(S, p.unit, 0);
      S.roster.push(nu);
      const spot = freeTileNear(S, u.x, u.y, nu.fly, 3);
      gains.push({ ic: nu.em, txt: `${nu.name} 합류` });
      if (spot) {
        nu.x = spot[0]; nu.y = spot[1]; nu.moved = true; nu.acted = true; nu.cdLeft = 0; nu.statuses = [];
        S.night.deployed.push(nu);
        note = ' · 다음 턴부터 싸운다';
      } else note = ' · 전투가 끝나면 합류';
    } else { S.mat += 2; gains.push({ ic: '⚙️', txt: '자재 +2' }); note = ' · 대원이 가득 차 보급품으로 대신 받았다'; }
  }
  S.night.loot.push(...gains);
  addLog(S, `${PICKUPS[p.kind].em} ${eul(pickupName(p))} ${PICKUPS[p.kind].v} — ${gains.map(g => g.ic + ' ' + g.txt).join(', ')}${note}`);
}
/* 악마가 보급품 칸에 들어서면 망가진다 */
function tramplePickup(S, e) {
  const p = pickupAt(S, e.x, e.y); if (!p) return;
  p.taken = true; p.lost = true;
  addLog(S, `${i(e.name)} ${eul(pickupName(p))} ${PICKUPS[p.kind].lost}...`);

function dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
function isPlayerType(type) { return !!UT[type]; }

/* =====================  전투: 피해/상태  ===================== */
function computeDamage(attacker, target, mult) {
  let raw = attacker.atk * (mult || 1);
  const isCrit = Math.random() < critChanceOf(attacker);
  if (isCrit) raw *= (attacker.officer ? 3 : 2);
  const isBlocked = Math.random() < blockChanceOf(target);
  if (isBlocked) raw *= 0.5;
  return { dmg: Math.max(1, Math.round(raw - (target.def || 0))), isCrit, isBlocked };
}
function checkEnrage(S, boss) {
  if (boss.enrage && !boss.enraged && boss.hp <= boss.hpMax * boss.enrage) {
    boss.enraged = true; boss.atk = Math.round(boss.atk * 1.5);
    addLog(S, `${i(boss.name)} 분노했다! 공격력이 크게 오른다.`);
  }
}
function applyDamage(S, target, dmg) {
  target.hp = clamp(target.hp - dmg, 0, target.hpMax);
  if (target.boss) checkEnrage(S, target);
  if (target.hp <= 0 && target.alive) {
    target.alive = false;
    if (isPlayerType(target.type)) { addLog(S, `${i(target.name)} 쓰러졌다...`); S.night.downed.push(target.id); }
    else { S.stats.kills++; addLog(S, `${eul(target.name)} 쓰러뜨렸다!`); }
    return true;
  }
  return false;
}
function addStatus(u, st) { u.statuses.push(Object.assign({}, st)); }
function creditXp(S, attacker, dmg, killed) {
  if (!isPlayerType(attacker.type)) return;
  const gain = Math.round(dmg * 0.5) + (killed ? 5 : 0);
  attacker.xp += gain;
  for (const rt of attacker.rt) S.techXP[rt] += gain;
  if (killed) attacker.kills = (attacker.kills || 0) + 1;
}
function hitTag(isCrit, isBlocked) { return (isCrit ? ' (치명타!)' : '') + (isBlocked ? ' (방어!)' : ''); }
function doAttack(S, attacker, target, mult) {
  const { dmg, isCrit, isBlocked } = computeDamage(attacker, target, mult || 1);
  const died = applyDamage(S, target, dmg);
  addLog(S, `${i(attacker.name)} ${target.name}에게 ${dmg}의 피해${hitTag(isCrit, isBlocked)}`);

}
function tickStatuses(S) {
  const all = S.night.deployed.concat(S.night.enemies).filter(u => u.alive);
  for (const u of all) {
    for (const st of u.statuses.slice()) {
      if (st.dps && u.alive) { applyDamage(S, u, st.dps); if (u.alive) addLog(S, `${i(u.name)} ${st.n} 피해 ${st.dps}`); }
      st.turns--;
      if (st.turns <= 0 && st.defBuff) u.def -= st.defBuff;
      if (st.turns <= 0 && st.atkBuff) u.atk -= st.atkBuff;
    }
    u.statuses = u.statuses.filter(s => s.turns > 0);
  }
  for (const u of S.night.deployed.filter(u => u.alive)) { u.moved = false; u.acted = false; if (u.cdLeft > 0) u.cdLeft--; }
}

/* =====================  보스 특수 능력  ===================== */
function tryBossAbility(S, boss) {
  for (const ab of boss.ab) if (ab.first && !ab.used && S.night.turn >= ab.first) return ab;
  for (const ab of boss.ab) if (ab.ev && (S.night.turn - ab.lastTurn) >= ab.ev) return ab;
  return null;
}
function executeAbility(S, boss, ab) {
  if (ab.k === 'summon') {
    const fly = !!ET[ab.type].fly;
    for (let k = 0; k < ab.n; k++) {
      const t = freeTileNear(S, boss.x, boss.y, fly, 3) || openSpawnTile(S, fly);
      if (t) S.night.enemies.push(spawnEnemy(S, ab.type, t[0], t[1]));
    }
    addLog(S, `${i(boss.name)} ${eul(ET[ab.type].n)} 불러냈다!`);
    return true;
  }
  if (ab.k === 'fireball') {
    const targets = S.night.deployed.filter(u => u.alive && dist(boss, u) <= (ab.rng || 99));
    if (!targets.length) return false;
    const t = pick(targets); const { dmg, isCrit, isBlocked } = computeDamage(boss, t, 1.3);
    applyDamage(S, t, dmg); addLog(S, `${boss.name}의 화염구가 ${eul(t.name)} 덮쳤다! ${dmg}의 피해${hitTag(isCrit, isBlocked)}`);
    return true;
  }
  if (ab.k === 'slam') {
    const targets = S.night.deployed.filter(u => u.alive && dist(boss, u) <= 1);
    if (!targets.length) return false;
    const t = targets.sort((a, b) => dist(boss, a) - dist(boss, b))[0];
    const { dmg, isCrit, isBlocked } = computeDamage(boss, t, 1.6);
    applyDamage(S, t, dmg); addLog(S, `${boss.name}의 강타! ${i(t.name)} ${dmg}의 피해를 입었다${hitTag(isCrit, isBlocked)}`);
    return true;
  }
  if (ab.k === 'plague') {
    const targets = S.night.deployed.filter(u => u.alive && dist(boss, u) <= (ab.rng || 2));
    if (!targets.length) return false;
    targets.forEach(t => addStatus(t, { n: '역병', dps: ab.d, turns: 2 }));
    addLog(S, `${i(boss.name)} 역병을 퍼뜨렸다!`);
    return true;
  }
  return false;
}

/* =====================  적 AI 턴  ===================== */
function attackVillage(S, e) {
  const crit = Math.random() < critChanceOf(e);
  const dmg = e.atk * (crit ? 2 : 1);
  S.houseHp = clamp(S.houseHp - dmg, 0, S.houseHpMax);
  S.night.villageHitTurn = S.night.turn;
  addLog(S, `${i(e.name)} 마을을 공격했다! 마을 체력 -${dmg}${crit ? ' (치명타!)' : ''}`);
  checkNightEnd(S);
}
/* 사거리 안에 대원이 있으면 대원을, 없고 마을이 닿으면 마을을 친다 */
function enemyStrike(S, e) {
  const inRange = S.night.deployed.filter(u => u.alive && dist(e, u) <= e.rng);
  if (inRange.length) {
    inRange.sort((a, b) => dist(e, a) - dist(e, b) || a.hp - b.hp);
    doAttack(S, e, inRange[0], 1);
    return true;
  }
  if (distToVillage(e.x, e.y) <= e.rng) { attackVillage(S, e); return true; }
  return false;
}
/* 망루 — 매 턴 마을 근처의 가장 가까운 악마를 쏜다 */
function towerFire(S) {
  const lv = S.house.tower; if (!lv) return;
  const targets = S.night.enemies.filter(e => e.alive && distToVillage(e.x, e.y) <= TOWER_RNG);
  if (!targets.length) return;
  targets.sort((a, b) => distToVillage(a.x, a.y) - distToVillage(b.x, b.y) || a.hp - b.hp);
  const t = targets[0];
  const dmg = Math.max(1, TUNE.towerBase + TUNE.towerPer * lv - (t.def || 0));
  addLog(S, `🔭 망루가 ${eul(t.name)} 저격했다! ${dmg}의 피해`);
  applyDamage(S, t, dmg);
  checkNightEnd(S);
}
function enemyTurn(S) {
  towerFire(S);
  for (const e of S.night.enemies) {
    if (!e.alive || S.night.over) continue;
    if (e.statuses.some(s => s.stun)) { addLog(S, `${i(e.name)} 기절해 움직이지 못한다.`); continue; }
    if (e.boss) {
      const ab = tryBossAbility(S, e);
      if (ab) {
        const fired = executeAbility(S, e, ab);
        if (fired) { if (ab.first) ab.used = true; ab.lastTurn = S.night.turn; checkNightEnd(S); continue; }
      }
    }
    if (enemyStrike(S, e)) { checkNightEnd(S); continue; }
    // 목표 정하기: 가까이(AGGRO칸) 있는 대원을 쫓되, 멀리 돌아가야 하면 마을로 향한다
    let field = null;
    const near = S.night.deployed.filter(u => u.alive && dist(e, u) <= AGGRO).sort((a, b) => dist(e, a) - dist(e, b))[0];
    if (near) {
      const cf = fieldFrom(S, tilesAround(near.x, near.y, e.rng), e.fly);
      const cd = cf.get(key(e.x, e.y));
      if (cd !== undefined && cd <= AGGRO + 2) field = cf;
    }
    if (!field) field = fieldFrom(S, villageAttackTiles(e.rng), e.fly);
    const [nx, ny] = moveAlongField(S, e, field);
    e.x = nx; e.y = ny;

}
function checkNightEnd(S) {
  if (S.night.over) return;
  if (S.houseHp <= 0) { S.night.over = 'defeat'; return; }
  const enemiesLeft = S.night.enemies.some(e => e.alive);
  const moreWaves = S.night.wavesLeft.length > 0;
  const bossPending = S.night.bossKey && !S.night.bossSpawned;
  const aliveUnits = S.night.deployed.some(u => u.alive);
  if (!aliveUnits && (enemiesLeft || moreWaves || bossPending)) { S.night.over = 'defeat'; return; }
  if (!enemiesLeft && !moreWaves && !bossPending) { S.night.over = 'victory'; return; }
}

/* =====================  플레이어 조작  ===================== */
function skillTargets(S, u) {
  const sk = u.sk; if (!sk || u.cdLeft > 0) return [];
  const rng = sk.rng || u.rng;
  if (sk.k === 'heal') return S.night.deployed.filter(a => a.alive && a.hp < a.hpMax && dist(u, a) <= rng && (!sk.only || a.rt.includes(sk.only)));
  if (sk.k === 'cleave' || sk.k === 'buff' || sk.k === 'judgment' || sk.k === 'multiply') return [];
  if (sk.k === 'charge') return S.night.enemies.filter(e => e.alive && dist(u, e) <= sk.dist && lineClear(S, u, e));
  return S.night.enemies.filter(e => e.alive && dist(u, e) <= rng);
}
/* 스킬을 실제로 쓰기 전에 영향 범위를 미리 보여주기 위한 계산 (확인/취소 단계용) */
function skillAoeTiles(S, u, targetId) {
  const sk = u.sk;
  const t = targetId != null ? (S.night.enemies.find(e => e.id === targetId) || S.night.deployed.find(a => a.id === targetId)) : null;
  if (sk.k === 'cleave') return tilesAround(u.x, u.y, 1);
  if (sk.k === 'judgment') return S.night.enemies.filter(e => e.alive).map(e => [e.x, e.y]);
  if (sk.k === 'buff') return [[u.x, u.y], ...tilesAround(u.x, u.y, sk.rad)];
  if (sk.k === 'multiply') return freeTilesNear(S, u.x, u.y, u.fly, sk.copies - 1, 5);

}
function tryMove(S, id, tx, ty) {

function tryAttack(S, id, targetId) {

  if (sk.once && u.onceUsed) return false;

    const targets = S.night.enemies.filter(e => e.alive && dist(u, e) <= 1);

  } else if (sk.k === 'multiply') {

    for (const [x, y] of spots) {
      const nu = makeUnit(S, u.type, u.xp);
      nu.x = x; nu.y = y; nu.moved = true; nu.acted = true; nu.cdLeft = 0; nu.statuses = []; nu.onceUsed = true; nu.kills = 0;
      S.roster.push(nu);
      S.night.deployed.push(nu);
    }

    ok = true;
  } else if (sk.k === 'judgment') {

    if (!targets.length) return false;
    targets.forEach(t => doAttack(S, u, t, sk.mult));

      addStatus(a, st);
    });
    addLog(S, `${i(u.name)} ${eul(sk.n)} 사용했다.`);
    ok = true;
  } else if (sk.k === 'heal') {
    const t = S.night.deployed.find(a => a.id === targetId && a.alive);
    if (!t || dist(u, t) > rng || (sk.only && !t.rt.includes(sk.only))) return false;
    t.hp = clamp(t.hp + sk.amt, 0, t.hpMax);

    const died = doAttack(S, u, t, sk.mult);

    if (!t || dist(u, t) > rng) return false;

function finalizeNightIfOver(S) {
  S.lastCodexUnlock = null;

    const infirm = S.house.infirm;
    S.night.downed.forEach((id, i) => {
      const u = S.roster.find(r => r.id === id); if (!u) return;
      if (i < infirm) { u.alive = true; u.hp = 1; } else { S.roster = S.roster.filter(r => r.id !== id); }
    });

      S.lastCodexUnlock = S.codexCount;

    addLog(S, S.night.turnLimitHit ? '너무 늦어버렸다...' : '집이 무너졌다...');

  const pk = S.night.map ? S.night.map.pickups : [];
  S.lastResult = { win: S.night.over === 'victory', day: S.day, kills: S.stats.kills, boss: S.night.bossKey, finalIdx: S.finalIdx,
    loot: S.night.loot ? S.night.loot.slice() : [], missed: pk.filter(p => !p.taken || p.lost).length };

}

/* 자동 저장 1칸 + 직접 고르는 저장 슬롯 3칸. 설치형 앱(홈 화면)에서는 사파리와 분리된 앱 전용 저장 공간을 쓴다 */
const SAVE_KEY = 'tenNights_save_v1';
const SLOTS = [

const TRANSIENT = new Set(['saveModalOpen', 'codexOpen', 'saveMsg', 'renamingUnitId', 'saveConfirm', 'importPreview']);
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
function serializeState(s) { return JSON.stringify(Object.assign({}, s, { _savedAt: Date.now() }), (k, v) => TRANSIENT.has(k) ? undefined : v); }
function validSave(o) { return !!(o && typeof o === 'object' && o.phase && Array.isArray(o.roster) && o.techXP && typeof o.day === 'number'); }
/* 예전 버전 저장에 없는 항목은 기본값으로 채운다 */
function migrateSave(o) {

}
function readSave(key) { try { const raw = localStorage.getItem(key); if (!raw) return null; const o = JSON.parse(raw); return validSave(o) ? migrateSave(o) : null; } catch (e) { return null; } }

  try {
    localStorage.setItem(key, serializeState(s));
    if (!persistAsked) { persistAsked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} }
    return true;

}

function timeAgo(t) {
  const sec = Math.floor((Date.now() - t) / 1000);
  if (sec < 60) return '방금 전';
  if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}시간 전`;
  const d = new Date(t); return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}

/* 저장 파일 내보내기 — 아이폰에서는 공유 시트("파일에 저장")로, 그 밖에서는 내려받기로 */
async function exportSaveFile() {
  const text = serializeState(S);
  const name = `13번째밤-${S.cycle + 1}회차-${S.day}일째.json`;
  const tryShare = async (type) => {
    const file = new File([text], name, { type });
    if (!(navigator.canShare && navigator.canShare({ files: [file] }))) return false;
    await navigator.share({ files: [file], title: '13번째 밤 저장 파일' });
    return true;
  };
  try {
    if (await tryShare('application/json') || await tryShare('text/plain')) { S.saveMsg = '📤 저장 파일을 보냈다. 공유 창에서 "파일에 저장"을 고르면 파일 앱에 보관된다.'; return; }
  } catch (e) { if (e && e.name === 'AbortError') { S.saveMsg = null; return; } }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const fileName = `13th-night-${S.cycle + 1}-${S.day}.json`;   // 일부 브라우저는 한글 파일명을 버리므로 영문으로
    a.download = fileName; a.style.display = 'none'; document.body.appendChild(a); a.click();

    S.saveMsg = `📤 ${fileName} 파일로 내보냈다.`;
  } catch (e) { S.saveMsg = '⚠️ 이 환경에서는 파일을 만들 수 없다. 아래 텍스트 백업을 이용하자.'; }
}

    S.importPreview = migrateSave(o); S.saveConfirm = { kind: 'import' }; S.saveMsg = null;

    const sel = S.selectedSquad.includes(u.id);
    const vt = veteranTier(u);
    const rankName = RANKS[u.rt.length>1?'X':u.rt[0]][u.rank];
    return `<div class="unit-row deploy-row ${sel?'sel':''}" data-act="toggleDeploy" data-id="${u.id}">
      <div class="deploy-check">${sel?'✔️':''}</div>
      <div class="unit-em ${vt?'vet-'+vt:''}">${u.em}${u.badge?`<span class="unit-badge">${u.badge}</span>`:''}</div>
      <div class="unit-mid">
        <div class="unit-name">${u.name} <span class="unit-rank">${rankName}</span>${vetBadge(u)}</div>
        <div class="unit-stats">공격 ${u.atk} · 방어 ${u.def} · 이동 ${u.mov} · 사거리 ${u.rng}${u.sk?` · ${u.sk.n}`:''}</div>
        <div class="unit-hpbar">${hpBar(u.hp,u.hpMax)}</div>
      </div>
    </div>`;
  }).join('');
  const n = S.selectedSquad.length;
  return `<div class="fade-in">
    <div class="topbar">
      <div><h2 class="title-md">출전 인원 선택</h2><p class="sub">${n} / ${cap}명 선택됨 · 탭해서 선택·해제</p></div>
    </div>
    <div class="screen" style="padding-top:6px">
      <div class="card">${S.roster.length ? rows : '<p class="sub">대원이 없다. 먼저 낮에 대원을 확보하자.</p>'}</div>
      <div style="height:8px"></div>
    </div>
    <div class="footer-cta" style="display:flex; gap:8px">
      <button class="btn" style="flex:0 0 auto" data-act="backToDay">돌아가기</button>
      <button class="btn primary" style="flex:1" data-act="confirmDeploy" ${n<1?'disabled':''}>🌙 이 인원으로 출전</button>
    </div>
  </div>`;
}
function renderEventModal() {

  if (!ce.resolved) {
    const choices = ev.ch.map((c, idx) => `<button class="choice-btn" data-act="choice" data-idx="${idx}" ${affordCost(S,c.cost)?'':'disabled'}>
        ${c.l}${c.cost? `<div class="choice-cost">비용: ${Object.entries(c.cost).map(([k,v])=>`${k==='mat'?'⚙️':'👥'}${v}`).join(' ')}</div>`:''}

function renderCodexModal() {
  const entries = CODEX.map((c, idx) => {
    if (idx < S.codexCount) {
      return `<div class="codex-entry ${idx===S.lastCodexUnlock?'new':''}">
        <div class="codex-num">${idx+1}</div>
        <div><div class="codex-title">${c.t}</div><p class="codex-body">${c.b}</p></div>
      </div>`;

    return `<div class="codex-entry locked">
      <div class="codex-num">${idx+1}</div>
      <div><div class="codex-title">🔒 ???</div></div>

}

function renderSaveModal() {
  const canSave = canSaveNow();
  const conf = S.saveConfirm;
  const slotCards = SLOTS.map(sl => {
    const o = readSave(sl.key);
    const sm = o ? saveSummary(o) : null;
    let actions;
    if (conf && conf.key === sl.key) {
      const q = conf.kind === 'save' ? `${sl.label}의 기록을 지금 진행 상황으로 바꿀까?`
              : conf.kind === 'load' ? '지금 하던 게임 대신 이 기록을 불러올까? 저장하지 않은 진행은 사라진다.'
              : `${sl.label}의 기록을 지울까? 되돌릴 수 없다.`;
      const okLabel = conf.kind === 'save' ? '덮어쓰기' : conf.kind === 'load' ? '불러오기' : '지우기';
      actions = `<div class="slot-confirm"><div class="slot-q">${q}</div>
        <div class="btn-row"><button class="btn ghost" data-act="slotCancel">취소</button><button class="btn primary" style="margin-left:auto" data-act="slotDo">${okLabel}</button></div></div>`;
    } else {
      const b = [];
      if (!sl.auto && canSave) b.push(`<button class="btn ${o ? '' : 'primary'}" data-act="slotAsk" data-kind="save" data-key="${sl.key}">${o ? '덮어쓰기' : '여기에 저장'}</button>`);
      if (o) b.push(`<button class="btn primary" data-act="slotAsk" data-kind="load" data-key="${sl.key}">불러오기</button>`);
      if (o && !sl.auto) b.push(`<button class="btn ghost" data-act="slotAsk" data-kind="delete" data-key="${sl.key}">지우기</button>`);
      actions = b.length ? `<div class="btn-row">${b.join('')}</div>` : '';
    }
    const body = sm
      ? `<div class="slot-title">${sm.title} <span class="sub">${sm.when}</span></div><div class="sub">${sm.detail}</div>`
      : `<div class="sub">${sl.auto ? '아직 자동 저장된 기록이 없다. 낮 화면에서 알아서 저장된다.' : (canSave ? '비어 있다. 지금 진행 상황을 여기에 남길 수 있다.' : '비어 있다.')}</div>`;
    return `<div class="slot-card ${o ? '' : 'empty'} ${sl.auto ? 'auto' : ''}">
      <div class="slot-mark">${sl.mark}</div>
      <div class="slot-body"><div class="slot-label">${sl.label}</div>${body}${actions}</div>
    </div>`;
  }).join('');

  let importBox = '';
  if (conf && conf.kind === 'import' && S.importPreview) {
    const sm = saveSummary(S.importPreview);
    importBox = `<div class="slot-confirm"><div class="slot-q">이 기록을 불러올까? <b>${sm.title}</b><br><span class="sub">${sm.detail}</span></div>
      <div class="btn-row"><button class="btn ghost" data-act="slotCancel">취소</button><button class="btn primary" style="margin-left:auto" data-act="slotDo">불러오기</button></div></div>`;
  }
  const backup = IN_FRAME
    ? `<div class="save-section">
        <h4>텍스트 백업</h4>
        <p class="sub">이 화면에서는 파일을 만들 수 없어서 텍스트로 옮긴다. 설치형 앱에서는 파일로 주고받을 수 있다.</p>
        ${canSave ? `<textarea class="save-textarea" readonly>${serializeState(S)}</textarea><button class="btn full" data-act="copyExport">텍스트 복사</button>` : ''}
        <textarea class="save-textarea" id="import-textarea" placeholder="백업해 둔 텍스트를 여기에 붙여넣기"></textarea>
        <button class="btn full" data-act="doImport">붙여넣은 텍스트 불러오기</button>
        ${importBox}
      </div>`
    : `<div class="save-section">
        <h4>파일 백업</h4>
        <p class="sub">저장 파일을 아이폰 '파일' 앱이나 iCloud Drive에 넣어 두면, 앱을 지웠다 다시 설치하거나 기기를 바꿔도 이어서 할 수 있다.</p>
        <div class="btn-row">
          ${canSave ? `<button class="btn" data-act="exportFile">📤 파일로 내보내기</button>` : ''}
          <button class="btn" data-act="pickFile">📥 파일에서 불러오기</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json,text/plain" style="display:none">
        ${importBox}
      </div>`;

  return `<div class="modal-wrap"><div class="modal ${saveModalWasOpen ? '' : 'fade-in'}" style="max-height:92vh">
    <h3 class="title-md">💾 저장 / 불러오기</h3>
    ${S.saveMsg ? `<div class="result-msg">${S.saveMsg}</div>` : ''}
    <div class="slot-list">${slotCards}</div>
    ${backup}
    <button class="btn" data-act="closeSaveModal">닫기</button>
  </div></div>`;
}

/* =====================  화면: 밤 인트로  ===================== */
function renderNightIntro() {
  setMode('night');
  const bossKey = S.night && S.night.bossKey;
  return `<div class="intro-wrap fade-in">
    <div class="night-num">${S.day}</div>
    <h1 class="title-lg">${S.day}번째 밤</h1>
    <p>${INTRO[S.day]}</p>
    ${bossKey ? `<p class="sub">⚠️ 대악마가 나타난다: ${ET[bossKey].n}</p>` : ''}
    ${S.night && S.night.map.pickups.length ? `<p class="sub">🎁 전장 곳곳에 보급품 ${S.night.map.pickups.length}개 — 대원을 그 칸으로 옮겨 회수하자</p>` : ''}
    <button class="btn primary" data-act="beginCombat">전투 시작</button>

/* =====================  화면: 밤 전투  ===================== */
function selUnit() { return S.night ? S.night.deployed.find(u => u.id === S.night.selectedId) : null; }
function pickupIcon(p) { return p.kind === 'rescue' ? UT[p.unit].em : PICKUPS[p.kind].em; }
function pickupReward(p) {
  if (p.kind === 'crate') return `⚙️ 자재 +${p.amt}`;
  if (p.kind === 'survivor') return `👥 난민 +${p.amt}`;
  if (p.kind === 'intel') return `${ROUTES[p.route].ic} ${ROUTES[p.route].n} 경험치 +${p.amt}`;
  return `${UT[p.unit].em} ${UT[p.unit].n} 합류`;
}
/* 지형·마을·보급품·적을 탭했을 때 보여 줄 설명 */
function tileInfo(x, y) {
  if (isVillage(x, y)) return `🏘️ 마을 — 체력 ${S.houseHp}/${S.houseHpMax}, 0이 되면 패배${S.house.tower ? ` · 🔭 망루가 ${TOWER_RNG}칸 안의 악마를 쏜다` : ''}`;
  const occ = occupant(S, x, y);
  if (occ && !isPlayerType(occ.type)) return `${occ.em} ${occ.name} — 체력 ${occ.hp}/${occ.hpMax} · 공격 ${occ.atk} · 이동 ${occ.mov} · 사거리 ${occ.rng}${occ.fly ? ' · 비행' : ''}`;
  const ter = terrainAt(S, x, y);
  if (ter) return `${TERRAIN[ter].em || '≈'} ${TERRAIN[ter].n} — ${TERRAIN[ter].d}`;
  if (isBarricade(S, x, y)) return '🧱 방벽 — 지상 악마의 진입을 막는다 · 비행 유닛은 넘어간다';
  const p = pickupAt(S, x, y);
  if (p) return `${pickupIcon(p)} ${pickupName(p)} (${pickupReward(p)}) — ${PICKUPS[p.kind].d}`;
  return null;
}
function renderNight() {
  setMode('night');
  const N = S.night;
  const boss = N.enemies.find(e => e.boss && e.alive);
  const u = selUnit();
  const reach = (u && !u.moved && N.mode==='idle') ? reachableTiles(S, u) : new Map();
  const skTargets = (u && N.mode==='skill') ? skillTargets(S, u) : [];
  const basicHit = (u && !u.acted && N.mode==='idle') ? N.enemies.filter(e=>e.alive && dist(u,e)<=u.rng) : [];
  const aoePreview = (u && N.mode==='confirm' && N.pendingSkill) ? skillAoeTiles(S, u, N.pendingSkill.targetId) : [];
  const vHit = N.villageHitTurn === N.turn - 1;

  let tiles = `<div class="village${vHit?' hit-flash':''}" data-act="tile" data-x="${VILLAGE.x}" data-y="${VILLAGE.y}"
      style="grid-column:${VILLAGE.x+1} / span ${VILLAGE.w};grid-row:${VILLAGE.y+1} / span ${VILLAGE.h}">
      <span class="v-em">🏘️</span>${S.house.tower?'<span class="v-tower">🔭</span>':''}
      <span class="v-hp"><i style="width:${pct(S.houseHp,S.houseHpMax)}%"></i></span>
    </div>`;
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      if (isVillage(x, y)) continue;
      const k = key(x, y);
      const occ = occupant(S, x, y);
      const ter = terrainAt(S, x, y);
      const wall = isBarricade(S, x, y);
      const p = pickupAt(S, x, y);
      let cls = 'tile';
      if (ter) cls += ' t-' + ter;
      if (wall) cls += ' wall';
      if (p && !occ) cls += ' pickup';
      if (reach.has(k)) cls += ' reach';
      if (u && u.x===x && u.y===y) cls += ' sel';
      if (basicHit.find(e=>e.x===x&&e.y===y) || skTargets.find(t=>t.x===x&&t.y===y)) cls += ' hit';
      if (aoePreview.some(([px,py])=>px===x&&py===y)) cls += ' aoe';
      let inner = '';
      if (occ) {
        inner = `${occ.boss?'<span class="boss-mark">👑</span>':''}${occ.badge?`<span class="unit-badge">${occ.badge}</span>`:''}${occ.em}
          <span class="mini-hp"><i style="width:${pct(occ.hp,occ.hpMax)}%;background:${isPlayerType(occ.type)?'var(--good)':'var(--accent)'}"></i></span>`;
      } else if (p) {
        inner = `<span class="pk">${pickupIcon(p)}</span>${p.kind==='rescue'?'<span class="sos">🆘</span>':''}`;
      } else if (ter) {
        inner = ter === 'water' ? '<span class="wave">≈</span>' : `<span class="ter">${TERRAIN[ter].em}</span>`;
      } else if (wall) {
        inner = '<span class="ter">🧱</span>';
      }
      tiles += `<div class="${cls}" data-act="tile" data-x="${x}" data-y="${y}" style="grid-column:${x+1};grid-row:${y+1}">${inner}</div>`;
    }
  }

  const tray = N.deployed.map(d => {
    let cls = 'tray-chip'; if (!d.alive) cls += ' dead'; else if (d.moved && d.acted) cls += ' acted'; if (d.id===N.selectedId) cls += ' active';
    const vt = veteranTier(d); if (vt) cls += ' vet-'+vt;
    return `<div class="${cls}" data-act="tile" data-x="${d.x}" data-y="${d.y}">
      ${d.em}<div class="tray-hp"><i style="width:${pct(d.hp,d.hpMax)}%"></i></div>
    </div>`;
  }).join('');

  const won = N.over === 'victory';
  const endLabel = won ? '밤 마치기 ▶' : '턴 종료 ▶';
  let actionBar = `<div class="btn-row"><button class="btn primary full" data-act="endTurn">${endLabel}</button></div>`;
  if (N.mode === 'confirm' && u) {
    const sk = u.sk;
    actionBar = `<div class="skill-confirm">
      <div class="sc-title">⚠️ 스킬을 사용합니다 — <b>${sk.n}</b></div>
      <div class="sc-desc">${sk.d}</div>
      <div class="btn-row">
        <button class="btn" data-act="cancelSkill">취소</button>
        <button class="btn primary" style="margin-left:auto" data-act="confirmSkill">확인</button>
      </div>
    </div>`;
  } else if (u && u.alive) {
    const skReady = u.sk && !u.acted && u.cdLeft===0 && !won && !(u.sk.once && u.onceUsed);
    actionBar = `<div class="sel-info"><span class="em">${u.em}</span><b>${u.name}</b>${vetBadge(u)}${officerBadge(u)} ${u.hp}/${u.hpMax}
        ${u.sk?`<span class="cd-chip">${u.sk.n}${u.cdLeft>0?` (${u.cdLeft})`:(u.sk.once&&u.onceUsed?' (사용함)':'')}</span>`:''}
      </div>
      <div class="sel-stats">${statLine(u)}</div>
      <div class="btn-row">
        <button class="btn" data-act="armSkill" ${skReady?'':'disabled'}>${N.mode==='skill'?'스킬 대상 선택 중…':'스킬 사용'}</button>
        <button class="btn ghost" data-act="deselect">선택 해제</button>
        <button class="btn primary" style="margin-left:auto" data-act="endTurn">${endLabel}</button>
      </div>`;
  }

  const left = pickupsLeft(S);
  const logText = won ? '✨ 모든 악마를 물리쳤다! 남은 보급품을 챙기고 밤을 마치자' : (N.hint || S.log[0] || '');
  const tileSize = `clamp(30px, calc((min(100vw, 480px) - ${28 + (GW-1)*3}px) / ${GW}), 44px)`;
  return `<div class="fade-in">
    <div class="topbar night-top">
      <div style="width:100%">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h2 class="title-md">${S.day}번째 밤</h2>
          <span class="turn-chip">턴 ${N.turn}/${TURN_LIMIT}</span>
        </div>
        <div class="bar-label"><span>🏘️ 마을 체력</span><span>${S.houseHp}/${S.houseHpMax}</span></div>
        ${hpBar(S.houseHp, S.houseHpMax, 'hp-house')}
        ${boss ? `<div class="bar-label" style="margin-top:4px"><span>${boss.em} ${boss.name}${boss.enraged?' 🔥':''}</span><span>${boss.hp}/${boss.hpMax}</span></div>${hpBar(boss.hp,boss.hpMax,'hp-house')}` : ''}
      </div>
    </div>
    <div class="screen" style="gap:8px;padding-top:8px">
      <div class="log-line ${won?'won':''} ${N.hint&&!won?'hint':''}">${logText}</div>
      <div class="board-wrap"><div class="board" style="--tile:${tileSize};grid-template-columns:repeat(${GW},var(--tile));grid-template-rows:repeat(${GH},var(--tile))">${tiles}</div></div>
      <div class="board-note">${left ? `🎁 남은 보급품 ${left}개 · 밤이 끝나면 사라진다 · ` : ''}🌲🪨≈ 지상 통과 불가 · 칸을 탭하면 설명</div>
      <div class="unit-tray">${tray}</div>
    </div>
    <div class="action-bar">${actionBar}</div>
  </div>`;
}

/* =====================  화면: 결과 / 게임오버 / 엔딩  ===================== */

  const unlock = S.lastCodexUnlock;
  return `<div class="result-wrap fade-in">
    <div class="result-em">${r.win?'🌅':'💥'}</div>
    <h1 class="title-lg">${r.win?`${r.day}번째 밤을 버텨냈다`:'집이 무너졌다'}</h1>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${S.stats.kills}</div><div class="stat-lbl">총 처치</div></div>
      <div class="stat-box"><div class="stat-num">${S.roster.filter(u=>u.alive).length}</div><div class="stat-lbl">생존 대원</div></div>
      <div class="stat-box"><div class="stat-num">${powerScore(S)}</div><div class="stat-lbl">전투력</div></div>
    </div>
    ${r.win && r.loot && r.loot.length ? `<div class="loot-box"><div class="sub">전장에서 회수한 것</div><div class="gain-row" style="justify-content:center">${r.loot.map(g=>`<span class="gain-chip">${g.ic} ${g.txt}</span>`).join('')}</div></div>` : ''}
    ${r.win && r.missed ? `<p class="sub">놓친 보급품 ${r.missed}개</p>` : ''}
    ${unlock!=null ? `<button class="card codex-unlock-card" data-act="openCodex">🔓 새로운 이야기 해금 — <b>${CODEX[unlock].t}</b><span class="sub" style="display:block">탭해서 읽기</span></button>` : ''}
    ${r.win ? `<button class="btn primary full" data-act="proceed">${nextLabel}</button>`
            : `<div class="btn-row" style="width:100%;flex-direction:column">
                 <button class="btn primary full" data-act="retryNight">이 밤 다시 도전</button>
                 <button class="btn full" data-act="newGame">처음부터 다시</button>
               </div>`}
  </div>`;
}
function renderEnding() {
  setMode('day');
  if (S.gameLocked) {
    return `<div class="result-wrap fade-in">
      <div class="result-em">😇</div>
      <h1 class="title-lg">${HIDDEN_ENDING.t}</h1>
      <p>${HIDDEN_ENDING.b}</p>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-num">${S.stats.kills}</div><div class="stat-lbl">총 처치</div></div>
        <div class="stat-box"><div class="stat-num">${S.cycle+1}</div><div class="stat-lbl">회차</div></div>
        <div class="stat-box"><div class="stat-num">${powerScore(S)}</div><div class="stat-lbl">전투력</div></div>
      </div>
      <p class="sub">이야기는 여기서 완전히 끝난다. 더 이상 이어지지 않는다.</p>
    </div>`;
  }
  const boss = FINALS[S.finalIdx];
  return `<div class="result-wrap fade-in">
    <div class="result-em">${ET[boss].em}</div>
    <h1 class="title-lg">${eul(ET[boss].n)} 물리쳤다</h1>
    <p>${ENDINGS[S.finalIdx]}</p>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${S.stats.kills}</div><div class="stat-lbl">총 처치</div></div>
      <div class="stat-box"><div class="stat-num">${S.cycle+1}</div><div class="stat-lbl">회차</div></div>
      <div class="stat-box"><div class="stat-num">${powerScore(S)}</div><div class="stat-lbl">전투력</div></div>
    </div>
    <div class="btn-row" style="width:100%;flex-direction:column">
      <button class="btn primary full" data-act="newCycle">새 회차로 계속하기</button>
      <button class="btn full" data-act="newGame">처음부터 다시</button>
    </div>
  </div>`;
}

/* =====================  렌더 디스패치  ===================== */
function render() {
  let html;
  switch (S.phase) {
    case 'intro': html = renderIntro(); break;
    case 'day': html = renderDay() + (S.currentEvent ? renderEventModal() : ''); break;
    case 'deploy': html = renderDeploy(); break;
    case 'nightIntro': html = renderNightIntro(); break;
    case 'night': html = renderNight(); break;
    case 'result': html = renderResult(); break;
    case 'ending': html = renderEnding(); break;
    default: html = renderIntro();
  }
  if (S.codexOpen) html += renderCodexModal();
  if (S.saveModalOpen) html += renderSaveModal();
  saveModalWasOpen = !!S.saveModalOpen;
  $app().innerHTML = html;
  if (S.phase === 'day' || S.phase === 'deploy' || (S.phase === 'ending' && S.gameLocked)) saveGame(S);
}

/* =====================  입력 처리  ===================== */
document.addEventListener('DOMContentLoaded', () => {
  $app().addEventListener('change', (e) => {
    if (e.target && e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
      e.target.files[0].text().then(txt => { stageImport(txt); render(); }).catch(() => { S.saveMsg = '⚠️ 파일을 열지 못했다.'; render(); });
    }
  });
  $app().addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (S.night && act !== 'tile') S.night.hint = null;
    if (act === 'newGame') { clearSave(); S = newGame(); S.phase='day'; newDay(S); S.mat=8; S.ref=2; S.roster.push(makeUnit(S,'rifle',0)); S.roster.push(makeUnit(S,'wolf',0)); }
    else if (act === 'continueGame') { const save = loadGame(); if (save) S = save; }
    else if (act === 'scout') { if (S.outingsLeft>0){ S.outingsLeft--; S.currentEvent = { loc:t.dataset.loc, ev: rollEvent(S,t.dataset.loc), resolved:false }; } }
    else if (act === 'choice') { const ce=S.currentEvent; const ch=ce.ev.ch[+t.dataset.idx]; if(affordCost(S,ch.cost)){ const r=resolveChoice(S,ch); ce.msg=r.msg; ce.gains=r.gains; ce.resolved=true; } }
    else if (act === 'closeEvent') { S.currentEvent = null; }
    else if (act === 'openCodex') { S.codexOpen = true; }
    else if (act === 'closeCodex') { S.codexOpen = false; }
    else if (act === 'openSaveModal') { S.saveModalOpen = true; S.saveMsg = null; S.saveConfirm = null; S.importPreview = null; }
    else if (act === 'closeSaveModal') { S.saveModalOpen = false; S.saveMsg = null; S.saveConfirm = null; S.importPreview = null; }
    else if (act === 'slotCancel') { S.saveConfirm = null; S.importPreview = null; }
    else if (act === 'slotAsk') {
      const k = t.dataset.key, kind = t.dataset.kind, exists = !!readSave(k);
      S.saveMsg = null; S.importPreview = null;
      if (kind === 'save' && !exists) { S.saveMsg = writeSave(k, S) ? `✅ ${SLOTS.find(x => x.key === k).label}에 저장했다.` : '⚠️ 저장 공간이 부족하거나 저장이 막혀 있다.'; S.saveConfirm = null; }
      else if (kind === 'load' && S.phase === 'intro') { const o = readSave(k); if (o) { S = o; } }
      else S.saveConfirm = { key: k, kind };
    }
    else if (act === 'slotDo') {
      const c = S.saveConfirm; S.saveConfirm = null;
      if (c && c.kind === 'save') S.saveMsg = writeSave(c.key, S) ? `✅ ${SLOTS.find(x => x.key === c.key).label}에 저장했다.` : '⚠️ 저장 공간이 부족하거나 저장이 막혀 있다.';
      else if (c && c.kind === 'delete') { removeSave(c.key); S.saveMsg = `🗑️ ${SLOTS.find(x => x.key === c.key).label}을(를) 지웠다.`; }
      else if (c && c.kind === 'load') { const o = readSave(c.key); if (o) { S = o; } else S.saveMsg = '⚠️ 기록을 읽지 못했다.'; }
      else if (c && c.kind === 'import' && S.importPreview) { const o = S.importPreview; S = o; saveGame(S); }
    }
    else if (act === 'exportFile') { exportSaveFile().then(render); }
    else if (act === 'pickFile') { const inp = document.getElementById('import-file'); if (inp) { inp.value = ''; inp.click(); } }
    else if (act === 'copyExport') {
      const text = serializeState(S);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => { S.saveMsg = '📋 복사했다. 메모 앱 같은 곳에 붙여넣어 보관하자.'; render(); })
          .catch(() => { S.saveMsg = '복사가 막혀 있다. 위 텍스트 상자를 길게 눌러 전체 선택 후 복사하자.'; render(); });
      } else S.saveMsg = '복사가 막혀 있다. 위 텍스트 상자를 길게 눌러 전체 선택 후 복사하자.';
    }
    else if (act === 'doImport') {
      const ta = document.getElementById('import-textarea');
      if (!ta || !ta.value.trim()) S.saveMsg = '먼저 백업 텍스트를 붙여넣어 주세요.';
      else stageImport(ta.value);
    }
    else if (act === 'upgradeHouse') { upgradeHouse(S, t.dataset.key); }
    else if (act === 'train') { trainUnit(S, t.dataset.type); }
    else if (act === 'fuse') { fuseUnit(S, t.dataset.type); }
    else if (act === 'sellUnit') { sellUnit(S, +t.dataset.id); }
    else if (act === 'renameUnit') { S.renamingUnitId = +t.dataset.id; }
    else if (act === 'cancelRename') { S.renamingUnitId = null; }
    else if (act === 'confirmRename') {
      const id = +t.dataset.id;
      const input = document.getElementById('rename-input-' + id);
      const u = S.roster.find(r => r.id === id);
      if (u && input) { const val = sanitizeName(input.value); if (val) u.name = val; }
      S.renamingUnitId = null;
    }
    else if (act === 'openDeploy') { S.phase = 'deploy'; ensureDeploySelection(S); }
    else if (act === 'toggleDeploy') { toggleDeploy(S, +t.dataset.id); }
    else if (act === 'backToDay') { S.phase = 'day'; }
    else if (act === 'confirmDeploy') { startNight(S); }
    else if (act === 'beginCombat') { beginCombat(S); }
    else if (act === 'tile') {
      const x = +t.dataset.x, y = +t.dataset.y;
      onTileTap(x, y);
    }
    else if (act === 'armSkill') {
      const u = selUnit();
      if (u && u.sk) {
        if (['cleave','buff','judgment','multiply'].includes(u.sk.k)) { S.night.mode='confirm'; S.night.pendingSkill={targetId:null}; }
        else { S.night.mode='skill'; }
      }
    }
    else if (act === 'confirmSkill') {
      const u = selUnit();
      if (u && S.night.pendingSkill) trySkill(S, u.id, S.night.pendingSkill.targetId);
      S.night.mode='idle'; S.night.pendingSkill=null;
    }
    else if (act === 'cancelSkill') { S.night.mode='idle'; S.night.pendingSkill=null; }
    else if (act === 'deselect') { S.night.selectedId=null; S.night.mode='idle'; }
    else if (act === 'endTurn') { endPlayerTurn(S); }
    else if (act === 'proceed') { proceedFromResult(S); }
    else if (act === 'retryNight') { retryNight(S); beginCombat(S); }
    else if (act === 'newCycle') { startNewCycle(S); }
    render();
  });
  render();
});

function onTileTap(x, y) {
  const N = S.night; if (!N) return;
  N.hint = null;
  const occ = occupant(S, x, y);
  if (N.mode === 'skill') {
    const u = selUnit(); if (!u) { N.mode='idle'; return; }
    const targets = skillTargets(S, u);
    const t = targets.find(tt => tt.x===x && tt.y===y);
    if (t) { N.mode = 'confirm'; N.pendingSkill = { targetId: t.id }; }
    else { N.mode = 'idle'; }
    return;
  }
  if (N.mode === 'confirm') return; // 확인/취소 버튼으로만 진행
  // idle 모드
  if (occ && isPlayerType(occ.type) && occ.alive) {
    if (N.selectedId === occ.id) { N.selectedId = null; return; }
    N.selectedId = occ.id; N.mode = 'idle'; return;
  }
  const u = selUnit();
  if (occ && !isPlayerType(occ.type)) { // 적 — 닿으면 공격, 아니면 정보
    if (u && !u.acted && N.over !== 'victory' && dist(u, occ) <= u.rng) tryAttack(S, u.id, occ.id);
    else N.hint = tileInfo(x, y);
    return;
  }
  // 빈 칸 (보급품 칸 포함) — 이동할 수 있으면 이동, 아니면 설명
  if (u && !u.moved && reachableTiles(S, u).has(key(x, y))) { tryMove(S, u.id, x, y); return; }
  const info = tileInfo(x, y);
  if (info) { N.hint = info; return; }
  if (u) N.selectedId = null;
}

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
